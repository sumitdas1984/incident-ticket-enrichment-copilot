[project]
name = "incident-ticket-enrichment-copilot"
version = "0.1.0"
description = "Production-grade AI Copilot for industrial alarm investigation and incident ticket preparation, integrating MCP-based alarm tooling with document-grounded RAG."
readme = "README.md"
requires-python = ">=3.13"
keywords = [
    "mcp",
    "model-context-protocol",
    "rag",
    "retrieval-augmented-generation",
    "copilot",
    "ai-assistant",
    "industrial",
    "alarm-management",
    "incident-ticket",
    "fastapi",
]
authors = [
    { name = "Sumit Das" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.0",
    "uvicorn>=0.54.0",
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/<org>/incident-ticket-enrichment-copilot"
Documentation = "https://github.com/<org>/incident-ticket-enrichment-copilot/tree/main/docs"
Issues = "https://github.com/<org>/incident-ticket-enrichment-copilot/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alarm_api", "alarm_mcp", "copilot", "mcp_server", "simulator", "frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "C4", "DTZ", "PIE", "RET", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
